<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Progress</title>
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>
</head>
<body>
    <button onclick="startTranslation()">Start Translation</button>
    <div id="progress-container">
        <p>Progress: <span id="progress-text">0%</span></p>
        <progress id="progress-bar" value="0" max="100"></progress>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io('http://127.0.0.1:5000');

        function startTranslation() {
            fetch('/start_translation', { method: 'POST' })
                .then(response => response.json())
                .then(data => console.log("Translation started! Task ID:", data.task_id));
        }

        socket.on('progress', function(data) {
            console.log(data.progress)
            document.getElementById('progress-bar').value = data.progress;
            document.getElementById('progress-text').innerText = data.progress + "%";
        });
    </script>
</body>
</html>
